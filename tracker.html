<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Suivi en direct</title>
<!-- POLITIQUE DE SÉCURITÉ DU CONTENU (02/10/2026). Contrairement à l'app, cette page
     part de `default-src 'none'` : elle est petite et tout ce qu'elle charge est connu.
     · script-src : ses deux fichiers et les deux CDN, AUCUN script inline — c'est
       pourquoi le code vit dans tracker.js et signature-partage.js.
     · style-src 'unsafe-inline' : le bloc <style> ci-dessous ; une injection de style
       n'exécute rien.
     · connect-src : OpenFreeMap (style, tuiles, glyphes, sprites) et Supabase, en
       https pour le client et en wss pour le canal Realtime.
     · worker-src blob: : MapLibre décode les tuiles dans un worker créé depuis un blob.
       ⚠ Un refus dans un worker n'atteint pas `securitypolicyviolation` : vérifier
       que la carte S'AFFICHE, pas seulement qu'aucun refus n'est signalé.
     Ajouter un service = ajouter son origine ici, sinon il échoue sans message. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self' data:; connect-src https://tiles.openfreemap.org https://husqmdqwqunufgjbcmsk.supabase.co wss://husqmdqwqunufgjbcmsk.supabase.co; worker-src blob:; child-src blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<!-- Ni l'identifiant ni la clé ne doivent partir chez les CDN ou OpenFreeMap : avec un
     lien `#s=` ils sont dans le fragment, que le navigateur n'envoie jamais ; avec un
     ancien lien `?s=`, c'est cette ligne qui les retient. -->
<meta name="referrer" content="no-referrer">
<!-- ⚠ Les empreintes `integrity` sont liées à ces versions EXACTES : changer un numéro
     sans recalculer fait échouer le chargement en silence (global absent).
     openssl dgst -sha384 -binary fichier | openssl base64 -A -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<style>
  html, body { margin: 0; height: 100%; background: #0a0e17; color: #E8ECF1;
               font-family: system-ui, -apple-system, sans-serif; }
  #map { position: absolute; inset: 0; z-index: 0; }
  /* L'attribution se pose en haut à gauche, SOUS le bandeau d'état : en bas elle
     serait cachée par le panneau des chiffres, or elle est une condition
     d'utilisation d'OpenFreeMap et d'OpenStreetMap, pas un ornement. */
  .maplibregl-ctrl-top-left { top: 58px; }

  #panel {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    background: linear-gradient(180deg, rgba(10,14,23,0) 0%, rgba(10,14,23,0.92) 30%, #0a0e17 100%);
    padding: 40px 16px 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  #status {
    position: absolute; top: 14px; left: 14px; right: 14px; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    background: #111826; border: 1px solid rgba(255,255,255,0.09);
    border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 600;
  }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7686; flex-shrink: 0; }
  #status.live .dot { background: #4DE8E0; box-shadow: 0 0 6px 1px rgba(77,232,224,0.7); }
  #status.ended .dot { background: #f85149; }

  .row { display: flex; gap: 10px; }
  .tile {
    flex: 1; background: #111826; border: 1px solid rgba(255,255,255,0.09);
    border-radius: 10px; padding: 10px 12px;
  }
  .tile .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.2px;
               color: #8B96A8; margin-bottom: 3px; }
  .tile .val { font-size: 17px; font-weight: 700; }
  .tile .sub { font-size: 12px; color: #8B96A8; margin-top: 2px; }
  .tile .sub:empty { display: none; }
  #dest { font-size: 13px; color: #8B96A8; }
  #dest b { color: #E8ECF1; font-weight: 600; }

  #erreur {
    position: absolute; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px; background: #0a0e17;
  }
  #erreur.visible { display: flex; }
  #erreur p { max-width: 340px; color: #8B96A8; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>

  <div id="status"><span class="dot"></span><span id="status-txt">Connexion…</span></div>

  <div id="map"></div>

  <div id="panel">
    <div id="dest">Destination : <b id="dest-val">—</b></div>
    <div class="row">
      <div class="tile"><div class="lbl">Vitesse</div><div class="val" id="val-vitesse">—</div></div>
      <div class="tile"><div class="lbl">Arrivée</div><div class="val" id="val-eta">—</div><div class="sub" id="val-reste"></div></div>
      <div class="tile"><div class="lbl">Dernière position</div><div class="val" id="val-maj">—</div></div>
    </div>
  </div>

  <div id="erreur">
    <p id="erreur-txt">Lien de suivi invalide — il manque l'identifiant de session dans l'adresse.</p>
  </div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
        integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"
        integrity="sha384-ysv13JVP3fufiEXfjML9OdCa/rRbMJvUBOWyor82wfuK8INNZAvmbxHgKIHi+oqz" crossorigin="anonymous"></script>
<!-- Ordre obligatoire : la vérification avant la page qui l'appelle. -->
<script src="signature-partage.js"></script>
<script src="tracker.js"></script>
</body>
</html>
